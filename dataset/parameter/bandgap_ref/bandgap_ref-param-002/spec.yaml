# Reduced spec for the bandgap reference.
# Source: Analog Design Bench task sky130-bandgap-reference-pvt (upstream/instruction.md).
# Limits are the upstream limits; only the nominal condition (tt, 1.8 V, 27 C) is checked,
# plus a temperature sweep (-40..125 C) and a 1.62-1.98 V line sweep at tt.
# Not included from upstream: PVT corners, Monte Carlo, noise, VDD line-step.
#
# margin = how far past the limit a faulted circuit must land to count as a "clear" failure.
# kind   = static (op/dc analyses) or dynamic (ac/tran analyses).
circuit: bandgap_ref
subckt: bandgap_reference
source: https://github.com/Arcadia-1/analog-design-bench/tree/main/tasks/sky130-bandgap-reference-pvt
testbench: testbench.spi
specs:
  - {metric: vref_v,         min: 1.18, max: 1.26, margin: 0.02, kind: static,  desc: "Reference voltage (V)"}
  - {metric: power_uw,       max: 150,             margin: 15,   kind: static,  desc: "VDD power at 1.8 V (uW)"}
  - {metric: line_mv_per_v,  max: 20,              margin: 4,    kind: static,  desc: "Line regulation 1.62-1.98 V (mV/V)"}
  - {metric: tc_ppm_per_c,   max: 50,              margin: 10,   kind: static,  desc: "Temperature coefficient, box method -40..125 C (ppm/C)"}
  - {metric: psrr_max_vv,    max: 0.20,            margin: 0.04, kind: dynamic, desc: "Max |VDD->VREF| 10 Hz-100 MHz (V/V)"}
  - {metric: startup_min_v,  min: 1.18,            margin: 0.02, kind: dynamic, desc: "Min VREF 10-20 us after a 1 us supply ramp (V)"}
  - {metric: startup_max_v,  max: 1.26,            margin: 0.02, kind: dynamic, desc: "Max VREF 10-20 us after a 1 us supply ramp (V)"}
  - {metric: overshoot_mv,   max: 100,             margin: 20,   kind: dynamic, desc: "Startup overshoot above final value (mV)"}
